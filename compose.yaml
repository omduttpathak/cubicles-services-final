services:
  mysql:
    image: mysql:8.4
    container_name: cubicles-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cubicles_services}
      MYSQL_USER: ${MYSQL_USER:-cubicles}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - cubicles_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: cubicles-backend
    restart: unless-stopped

    environment:
      APP_NAME: ${APP_NAME:-Cubicles Services API}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      ENVIRONMENT: ${ENVIRONMENT:-development}

      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-cubicles}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-cubicles_services}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}

      FRONTEND_URLS: ${FRONTEND_URLS:-http://localhost:8080,http://127.0.0.1:8080}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}

      SQL_ECHO: ${SQL_ECHO:-false}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      DATABASE_WAIT_TIMEOUT: ${DATABASE_WAIT_TIMEOUT:-90}
      DATABASE_WAIT_INTERVAL: ${DATABASE_WAIT_INTERVAL:-2}

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:8000/api/health/ready",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    networks:
      - cubicles_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        VITE_API_URL: /api

    container_name: cubicles-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "${FRONTEND_PORT:-8080}:80"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    networks:
      - cubicles_internal

volumes:
  mysql_data:

networks:
  cubicles_internal:
    driver: bridge
